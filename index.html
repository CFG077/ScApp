<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Recovery Code Cleaner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial; padding: 20px; }
    textarea, pre { width: 100%; font-size: 16px; }
    textarea { height: 150px; }
    button { margin-top: 10px; padding: 10px; font-size: 16px; cursor: pointer; }
    #output { 
      background: #f4f4f4; 
      padding: 10px; 
      border: 1px solid #ccc; 
      border-radius: 5px; 
      white-space: pre; 
      overflow-x: auto; 
      max-height: 400px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <h2>Recovery Code Cleaner</h2>

  <textarea id="input" placeholder="Paste your recovery codes here..."></textarea>
  <br>
  <button id="cleanBtn">Clean Codes</button>
  <button id="copyBtn">Copy Output</button>

  <h3>Output:</h3>
  <pre id="output"></pre>

  <script>
    const cleanBtn = document.getElementById('cleanBtn');
    const copyBtn = document.getElementById('copyBtn');

    cleanBtn.addEventListener('click', () => {
      const input = document.getElementById("input").value;

      // Keep only letters and numbers
      const cleanedInput = input.replace(/[^A-Za-z0-9]/g, '');

      const CODE_LENGTH = 12;
      const CODES_PER_GROUP = 3;
      const result = [];

      for (let i = 0; i < cleanedInput.length; i += CODE_LENGTH * CODES_PER_GROUP) {
        const groupStr = cleanedInput.slice(i, i + CODE_LENGTH * CODES_PER_GROUP);
        const group = [];

        for (let j = 0; j < groupStr.length; j += CODE_LENGTH) {
          const code = groupStr.slice(j, j + CODE_LENGTH);
          if (code.length === CODE_LENGTH) group.push(code);
        }

        if (group.length === CODES_PER_GROUP) {
          // Join codes without spaces after commas
          result.push(`['${group.join("','")}']`);
        }
      }

      document.getElementById("output").textContent = result.join("\n\n");
    });

    copyBtn.addEventListener('click', () => {
      const output = document.getElementById("output").textContent;
      if (!output) { alert("No output to copy!"); return; }
      try {
        navigator.clipboard.writeText(output);
        alert("Output copied to clipboard!");
      } catch(e) {
        alert("Clipboard copy failed.");
      }
    });
  </script>
</body>
</html>
