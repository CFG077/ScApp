<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recovery Code Cleaner</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      padding: 20px; 
      background: #fafafa;
    }
    textarea, pre { 
      width: 100%; 
      font-size: 16px; 
    }
    textarea { 
      height: 150px; 
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button { 
      margin-top: 10px; 
      padding: 10px 15px; 
      font-size: 16px; 
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background-color: #007bff;
      color: white;
    }
    button:hover {
      background-color: #0056b3;
    }
    #output { 
      background: #f4f4f4; 
      padding: 10px; 
      border: 1px solid #ccc; 
      border-radius: 5px; 
      white-space: pre-wrap; 
      max-height: 400px; 
      overflow-y: auto; 
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h2>Recovery Code Cleaner</h2>

  <textarea id="input" placeholder="Paste your recovery codes here..."></textarea>
  <br>
  <button onclick="cleanCodes()">Clean Codes</button>
  <button onclick="copyOutput()">Copy Output</button>

  <h3>Output:</h3>
  <pre id="output"></pre>

  <script>
    function cleanCodes() {
      const input = document.getElementById("input").value;

      if (!input.trim()) {
        document.getElementById("output").textContent = "Please paste some codes first!";
        return;
      }

      // Remove quotes and text like "Supercell ID Recovery Codes:"
      let cleaned = input
        .replace(/["']/g, "")
        .replace(/Supercell\s*ID\s*Recovery\s*Codes:?/gi, "")
        .replace(/\s+/g, "") // remove all whitespace
        .toUpperCase();

      // Split every 12 characters into one code
      const codes = cleaned.match(/.{1,12}/g) || [];

      // Filter out any weird short fragments
      const validCodes = codes.filter(c => c.length === 12);

      // Format output: ['CODE1','CODE2','CODE3']
      const formatted = `['${validCodes.join("','")}']`;

      document.getElementById("output").textContent = formatted;
    }

    function copyOutput() {
      const output = document.getElementById("output").textContent;
      if (!output.trim()) {
        alert("No output to copy!");
        return;
      }
      navigator.clipboard.writeText(output)
        .then(() => alert("✅ Output copied to clipboard!"))
        .catch(err => alert("❌ Failed to copy: " + err));
    }
  </script>
</body>
</html>
