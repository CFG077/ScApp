<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recovery Code Cleaner</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      padding: 20px; 
      background: #fafafa;
    }
    textarea, pre { 
      width: 100%; 
      font-size: 16px; 
    }
    textarea { 
      height: 150px; 
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button { 
      margin-top: 10px; 
      padding: 10px 15px; 
      font-size: 16px; 
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background-color: #007bff;
      color: white;
    }
    button:hover {
      background-color: #0056b3;
    }
    #output { 
      background: #f4f4f4; 
      padding: 10px; 
      border: 1px solid #ccc; 
      border-radius: 5px; 
      white-space: pre-wrap; 
      max-height: 400px; 
      overflow-y: auto; 
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h2>Recovery Code Cleaner</h2>

  <textarea id="input" placeholder="Paste your recovery codes here..."></textarea>
  <br>
  <button onclick="cleanCodes()">Clean Codes</button>
  <button onclick="copyOutput()">Copy Output</button>

  <h3>Output:</h3>
  <pre id="output"></pre>

  <script>
    function cleanCodes() {
      const input = document.getElementById("input").value.trim();

      if (!input) {
        document.getElementById("output").textContent = "Please paste some codes first!";
        return;
      }

      // Split input into separate groups
      const groups = input
        .split(/Supercell ID Recovery Codes:|(?=\n\n)|(?=\r\n\r\n)/gi)
        .map(g => g.trim())
        .filter(g => g.length > 0);

      const result = groups.map(group => {
        // Remove any unwanted text or quotes
        let cleanedGroup = group
          .replace(/Supercell\s*ID\s*Recovery\s*Codes:?/gi, '')
          .replace(/"/g, '')
          .trim();

        // Split by commas, newlines, or multiple spaces
        const codes = cleanedGroup
          .split(/,|\n|\r|\s{2,}/)
          .map(c => c.trim())
          .filter(c => c.length > 0);

        // Remove all spaces inside each code
        const cleaned = codes.map(c => c.replace(/\s+/g, ''));

        // ✅ Join without any spaces after commas
        return `['${cleaned.join("','")}']`;
      });

      document.getElementById("output").textContent = result.join("\n\n");
    }

    function copyOutput() {
      const output = document.getElementById("output").textContent;
      if (!output) {
        alert("No output to copy!");
        return;
      }
      navigator.clipboard.writeText(output)
        .then(() => alert("✅ Output copied to clipboard!"))
        .catch(err => alert("❌ Failed to copy: " + err));
    }
  </script>
</body>
</html>
