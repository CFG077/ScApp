<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recovery Code Cleaner</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    textarea, pre { width: 100%; font-size: 16px; }
    textarea { height: 150px; }
    button { margin-top: 10px; padding: 10px; font-size: 16px; }
    #output { 
      background: #f4f4f4; 
      padding: 10px; 
      border: 1px solid #ccc; 
      border-radius: 5px; 
      white-space: pre-wrap; 
      max-height: 400px; 
      overflow-y: auto; 
    }
  </style>
</head>
<body>
  <h2>Recovery Code Cleaner</h2>

  <textarea id="input" placeholder="Paste your recovery codes here..."></textarea>
  <br>
  <button onclick="cleanCodes()">Clean Codes</button>
  <button onclick="copyOutput()">Copy Output</button>

  <h3>Output:</h3>
  <pre id="output"></pre>

  <script>
    function cleanCodes() {
      const input = document.getElementById("input").value.trim();

      // Split by each "Supercell ID Recovery Codes:" block
      const groups = input.split(/Supercell ID Recovery Codes:/i)
        .map(g => g.trim().replace(/^['"\[\]]+|['"\[\]]+$/g, "")) // remove [] and quotes
        .filter(g => g.length > 0);

      const result = groups.map(group => {
        // Remove all whitespace
        const cleaned = group.replace(/\s+/g, '').trim();

        // Split into 12-character recovery codes
        const codes = cleaned.match(/.{12}/g) || [];

        if (codes.length === 0) return "";

        // Add a single space after each comma
        return `['${codes.join(', ')}']`;
      });

      // Show each group separated by one blank line
      document.getElementById("output").textContent = result.join("\n\n");
    }

    function copyOutput() {
      const output = document.getElementById("output").textContent;
      if (!output) {
        alert("No output to copy!");
        return;
      }
      navigator.clipboard.writeText(output).then(() => {
        alert("Output copied to clipboard!");
      }).catch(err => {
        alert("Failed to copy: " + err);
      });
    }
  </script>
</body>
</html>
