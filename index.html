<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recovery Code Cleaner</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    textarea, pre { width: 100%; font-size: 16px; }
    textarea { height: 150px; }
    button { margin-top: 10px; padding: 10px; font-size: 16px; }
    #output { 
      background: #f4f4f4; 
      padding: 10px; 
      border: 1px solid #ccc; 
      border-radius: 5px; 
      white-space: pre; 
      overflow-x: auto; 
      max-height: 400px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <h2>Recovery Code Cleaner</h2>

  <textarea id="input" placeholder="Paste your recovery codes here..."></textarea>
  <br>
  <button onclick="cleanCodes()">Clean Codes</button>
  <button onclick="copyOutput()">Copy Output</button>

  <h3>Output:</h3>
  <pre id="output"></pre>

  <script>
    function cleanCodes() {
      const input = document.getElementById("input").value.trim();

      // Split input into groups using header or double newlines
      const groups = input
        .split(/(?:Supercell ID Recovery Codes:|\n\s*\n)+/i)
        .map(g => g.trim())
        .filter(g => g.length > 0);

      const result = groups.map(group => {
        // Check if the group is already an array string
        if (/^\s*\[.*\]\s*$/.test(group)) {
          // Remove brackets, split by comma, remove quotes and spaces
          const inner = group.replace(/^\[|\]$/g, '')
                             .split(',')
                             .map(c => c.trim().replace(/^['"]|['"]$/g, ''))
                             .filter(c => c.length > 0);
          return `['${inner.join("', '")}']`;
        } else {
          // Normal raw codes
          const codes = group.split(/,|\n/).map(c => c.trim()).filter(c => c.length > 0);
          const cleaned = codes.map(c => c.replace(/\s+/g, ''));
          return `['${cleaned.join("', '")}']`;
        }
      });

      // Output each group on its own line with a blank line between groups
      document.getElementById("output").textContent = result.join("\n\n");
    }

    function copyOutput() {
      const output = document.getElementById("output").textContent;
      if (!output) {
        alert("No output to copy!");
        return;
      }
      navigator.clipboard.writeText(output).then(() => {
        alert("Output copied to clipboard!");
      }).catch(err => {
        alert("Failed to copy: " + err);
      });
    }
  </script>
</body>
</html>
