<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recovery Code Cleaner</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    textarea, pre { width: 100%; font-size: 16px; }
    textarea { height: 150px; }
    button { margin-top: 10px; padding: 10px; font-size: 16px; }
    #output { 
      background: #f4f4f4; 
      padding: 10px; 
      border: 1px solid #ccc; 
      border-radius: 5px; 
      white-space: pre-wrap; 
      max-height: 400px; 
      overflow-y: auto; 
    }
  </style>
</head>
<body>
  <h2>Recovery Code Cleaner</h2>

  <textarea id="input" placeholder="Paste your recovery codes here..."></textarea>
  <br>
  <button onclick="cleanCodes()">Clean Codes</button>
  <button onclick="copyOutput()">Copy Output</button>

  <h3>Output:</h3>
  <pre id="output"></pre>

  <script>
    function cleanCodes() {
      const input = document.getElementById("input").value.trim();

      // Split groups by "Supercell ID Recovery Codes:" and filter out empty groups
      const groups = input.split(/Supercell ID Recovery Codes:/)
        .map(g => g.trim().replace(/^"+|"+$/g, "")) // remove leading/trailing quotes
        .filter(g => g.length > 0);

      const result = groups.map(group => {
        // Split lines and clean codes
        const codes = group.split(/\n/)
          .map(line => line.replace(/\s+/g, '').trim()) // remove all spaces
          .map(line => line.replace(/^"+|"+$/g, ""))    // remove quotes from lines
          .filter(line => line.length > 0);             // ignore empty lines

        if (codes.length === 0) return ""; // skip empty groups

        // ✅ strict one-line format, no spaces after commas
        return "['" + codes.join("','") + "']";
      }).filter(line => line.length > 0); // remove any empty strings

      // Add a blank line between groups for readability
      document.getElementById("output").textContent = result.join("\n\n");
    }

    function copyOutput() {
      const output = document.getElementById("output").textContent;
      if (!output) {
        alert("No output to copy!");
        return;
      }
      navigator.clipboard.writeText(output).then(() => {
        alert("Output copied to clipboard!");
      }).catch(err => {
        alert("Failed to copy: " + err);
      });
    }
  </script>
</body>
</html>
