<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recovery Code Cleaner</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      padding: 20px; 
      background: #fafafa;
    }
    textarea, pre { 
      width: 100%; 
      font-size: 16px; 
    }
    textarea { 
      height: 150px; 
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button { 
      margin-top: 10px; 
      padding: 10px 15px; 
      font-size: 16px; 
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background-color: #007bff;
      color: white;
    }
    button:hover {
      background-color: #0056b3;
    }
    #output { 
      background: #f4f4f4; 
      padding: 10px; 
      border: 1px solid #ccc; 
      border-radius: 5px; 
      white-space: pre-wrap; 
      max-height: 400px; 
      overflow-y: auto; 
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h2>Recovery Code Cleaner</h2>

  <textarea id="input" placeholder="Paste your recovery codes here..."></textarea>
  <br>
  <button onclick="cleanCodes()">Clean Codes</button>
  <button onclick="copyOutput()">Copy Output</button>

  <h3>Output:</h3>
  <pre id="output"></pre>

  <script>
    function cleanCodes() {
      const input = document.getElementById("input").value.trim();

      if (!input) {
        document.getElementById("output").textContent = "Please paste some codes first!";
        return;
      }

      // Remove all quotes and unnecessary labels
      let text = input
        .replace(/["']/g, '')
        .replace(/Supercell\s*ID\s*Recovery\s*Codes:?/gi, '')
        .trim();

      // Split into groups by double newlines or clear separations
      const groups = text.split(/\n\s*\n/).filter(g => g.trim().length > 0);

      const result = groups.map(group => {
        const codes = group
          .split(/,|\n| /)
          .map(c => c.trim())
          .filter(c => c.length > 0)
          .map(c => c.replace(/\s+/g, ''));

        // Skip invalid or empty code groups
        if (codes.length === 0) return null;

        // ✅ Join with no space after commas
        return `['${codes.join("','")}']`;
      }).filter(Boolean);

      // Show final result
      document.getElementById("output").textContent = result.join("\n\n");
    }

    function copyOutput() {
      const output = document.getElementById("output").textContent;
      if (!output) {
        alert("No output to copy!");
        return;
      }
      navigator.clipboard.writeText(output)
        .then(() => alert("✅ Output copied to clipboard!"))
        .catch(err => alert("❌ Failed to copy: " + err));
    }
  </script>
</body>
</html>
